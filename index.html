-size:15px;color:#405a4c}.learntext b{color:var(--ink)}.italian{font:700 26px 'Fraunces',serif;margin:10px 0;color:var(--ink)}.translation{font-size:13px;color:var(--muted)}.hint{background:#fff6df;border:1px solid #f0e0b8;border-radius:17px;padding:15px;margin:12px 0;font-size:13px;line-height:1.65}.tip{background:#e8f1ea;border-radius:15px;padding:14px;font-size:13px;line-height:1.6}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btnrow button{flex:1}.answer{display:block;width:100%;text-align:left;padding:15px;background:white;border:1.5px solid var(--line);border-radius:15px;margin:9px 0;color:var(--ink)}.answer.selected{border-color:var(--green);background:#e9f2e9}.answer.wrong{border-color:#e3a091;background:#fff0eb}.feedback{padding:15px;border-radius:15px;background:#e7f2e7;margin:14px 0;font-size:14px;line-height:1.6}.feedback.bad{background:#fff0e9}.field{width:100%;padding:16px;border-radius:15px;border:1.5px solid #d9e3d8;background:white;color:var(--ink);outline-color:var(--green)}textarea.field{min-height:120px;resize:vertical}.wordbank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.word{border:1px solid #d6e3d6;background:#f1f6ef;border-radius:12px;padding:11px 13px;font-weight:700}.word.used{opacity:.3}.wordline{min-height:55px;border:2px dashed #d9e4d9;border-radius:14px;padding:8px;display:flex;gap:6px;flex-wrap:wrap}.wordline button{background:#d7eadb;border:0;border-radius:10px;padding:9px}.mini{font-size:12px;color:var(--muted)}.chart{display:flex;gap:5px;align-items:flex-end;height:95px;margin:20px 0 8px}.bar{flex:1;background:#c6dfcb;border-radius:9px 9px 3px 3px;position:relative;min-height:14px}.bar.current{background:#2a7b61}.bar label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.tabs{display:flex;background:#e8eee6;border-radius:15px;padding:4px;gap:4px;margin:15px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px 5px;border-radius:11px;font-size:12p const lessons=[
{id:'sounds',icon:'🔊',title:'Wie Italienisch klingt',subtitle:'Aussprache, Betonung und erste Wörter',scene:'Ein Gespräch beginnt mit einem guten Klang.',intro:'Italienisch wird viel regelmäßiger geschrieben als Englisch. Wenn du ein paar Buchstabenkombinationen kennst, kannst du viele neue Wörter laut lesen.',rule:'Vor <b>e</b> und <b>i</b> klingt <b>c</b> oft wie „tsch“: <b>ciao</b>. Vor <b>a, o, u</b> klingt es wie k: <b>casa</b>. <b>ch</b> bewahrt den k-Laut: <b>chi</b>. Doppelkonsonanten werden hörbar länger gesprochen.',english:'Englisch „ch“ in <b>cheese</b> ähnelt italienisch „c“ in <b>ciao</b>. Anders als im Englischen sind italienische Vokale meist klar und kurz.',mnemonic:'🍋 Stell dir vor: „CIAO“ klingt wie „TSCHAU“ – ein Abschied, den du auch im Deutschen kennst.',examples:[['ciao','Hallo / Tschüss'],['casa','Haus'],['chi','wer'],['gelato','Eis']],choice:{q:'Welches Wort beginnt mit einem k-Laut?',options:['ciao','cena','casa'],correct:2,why:'„ca“ klingt wie „ka“. „ce“ und „ci“ werden wie „tsche“ und „tschi“ gesprochen.'},build:{q:'Bilde „Hallo, ich bin Lu.“',words:['Ciao,','sono','Lu.'],answer:'Ciao, sono Lu.'},write:{q:'Wie heißt „Haus“ auf Italienisch?',answers:['casa'],hint:'Vier Buchstaben, beginnt mit c.'},speak:'Ciao, sono Lu.',dialogue:[['A','Ciao!'],['B','Ciao, sono Lu.'],['A','Piacere!']]},
{id:'greetings',icon:'👋',title:'Ciao, piacere!',subtitle:'Begrüßen und sich vorstellen',scene:'Du triffst eine Nachbarin in Chia.',intro:'Ein kurzes Kennenlernen braucht nur wenige Bausteine. „Sono“ bedeutet „ich bin“. „Mi chiamo“ bedeutet wörtlich „ich nenne mich“.',rule:'<b>Ciao</b> ist informell. <b>Buongiorno</b> ist höflicher und passt tagsüber. <b>Buonasera</b> sagt man abends. <b>Piacere</b> heißt „Freut mich“.',english:'Italienisch <b>sono</b> entspricht „I am“. Im Italienischen kannst du <b>io</b> („ich“) häufig weglassen, weil das Verb die Person verrät.',mnemonic:'🤝 <b>Piacere</b> erinnert an englisch „pleasure“: „It’s a pleasure to meet you.“',examples:[['Buongiorno!','Guten Tag!'],['Mi chiamo Lu.','Ich heiße Lu.'],['Come ti chiami?','Wie heißt du?'],['Piacere!','Freut mich!']],choice:{q:'Du begrüßt eine unbekannte Verkäuferin am Vormittag. Was passt?',options:['Buongiorno!','Buonanotte!','Arrivederci!'],correct:0,why:'„Buongiorno“ ist eine höfliche Begrüßung am Tag.'},build:{q:'Bilde „Ich heiße Lu.“',words:['Mi','chiamo','Lu.'],answer:'Mi chiamo Lu.'},write:{q:'Schreibe „Freut mich!“ auf Italienisch.',answers:['piacere','piacere!'],hint:'Es ähnelt dem englischen Wort „pleasure“.'},speak:'Buongiorno, mi chiamo Lu.',dialogue:[['Nachbarin','Buongiorno! Come ti chiami?'],['Du','Mi chiamo Lu.'],['Nachbarin','Piacere!']]},
{id:'essere',icon:'🧩',title:'Ich bin, du bist',subtitle:'Das wichtige Verb essere',scene:'Du erzählst, wo du wohnst.',intro:'„Essere“ heißt „sein“. Es ist eines der wichtigsten Verben und leider unregelmäßig. Du lernst zunächst die Formen, die du im Alltag sofort brauchst.',rule:'<b>Io sono</b> = ich bin, <b>tu sei</b> = du bist, <b>lui/lei è</b> = er/sie ist, <b>noi siamo</b> = wir sind, <b>voi siete</b> = ihr seid, <b>loro sono</b> = sie sind.',english:'Wie englisch „I am / you are / she is“ hat auch Italienisch verschiedene Formen. „Sono“ kann sowohl „ich bin“ als auch „sie sind“ bedeuten – der Zusammenhang hilft.',mnemonic:'🏠 <b>Sono</b> klingt wie „so, no?“ – sage beim Betreten deines Hauses: „Sono a casa!“ (Ich bin zu Hause).',examples:[['Sono a casa.','Ich bin zu Hause.'],['Sei italiano?','Bist du Italiener?'],['Lei è gentile.','Sie ist freundlich.'],['Siamo in Sardegna.','Wir sind auf Sardinien.']],choice:{q:'Was bedeutet „Siamo in Sardegna“?',options:['Ich bin auf Sardinien.','Wir sind auf Sardinien.','Sie sind auf Sardinien.'],correct:1,why:'„Siamo“ ist die Wir-Form von „essere“.'},build:{q:'Bilde „Wir sind auf Sardinien.“',words:['Siamo','in','Sardegna.'],answer:'Siamo in Sardegna.'},write:{q:'Ergänze: „Tu ___ gentile.“',answers:['sei'],hint:'Die du-Form von essere hat drei Buchstaben.'},speak:'Sono in Sardegna.',dialogue:[['A','Sei tedesca?'],['B','Sì, sono tedesca.'],['A','Sei in vacanza?'],['B','No, sono qui a casa.']]},
{id:'avere',icon:'🐈',title:'Ich habe zwei Katzen',subtitle:'Avere und einfache Aussagen',scene:'Du erzählst von deinen Katzen.',intro:'„Avere“ bedeutet „haben“. Anders als im Deutschen sagt man auf Italienisch auch „ich habe Hunger“, „ich habe Durst“ und „ich habe ... Jahre“.',rule:'<b>Ho</b> = ich habe, <b>hai</b> = du hast, <b>ha</b> = er/sie hat, <b>abbiamo</b> = wir haben, <b>avete</b> = ihr habt, <b>hanno</b> = sie haben. Das h wird nicht gesprochen.',english:'„Ho“ entspricht „I have“. Aber: „Ho fame“ (I am hungry) benutzt im Italienischen „haben“ statt „sein“.',mnemonic:'🐱 <b>Ho</b> klingt wie ein überraschter Ausruf: „Oh! Ich habe eine Katze!“ – <b>Ho un gatto.</b>',examples:[['Ho due gatti.','Ich habe zwei Katzen.'],['Hai fame?','Hast du Hunger?'],['Abbiamo una casa.','Wir haben ein Haus.'],['Ho trent’anni.','Ich bin dreißig Jahre alt.']],choice:{q:'Wie sagt man „Ich habe Hunger“?',options:['Sono fame.','Ho fame.','Hai fame.'],correct:1,why:'Für Hunger verwendet Italienisch „avere“: „ho fame“.'},build:{q:'Bilde „Ich habe zwei Katzen.“',words:['Ho','due','gatti.'],answer:'Ho due gatti.'},write:{q:'Ergänze: „Noi ___ una casa.“',answers:['abbiamo'],hint:'Die wir-Form von avere beginnt mit ab-.'},speak:'Ho due gatti.',dialogue:[['A','Hai animali?'],['B','Sì, ho due gatti.'],['A','Che bello!']]},
{id:'articles',icon:'🍅',title:'Un pomodoro, una casa',subtitle:'Geschlecht und Artikel',scene:'Du kaufst Zutaten für das Abendessen.',intro:'Italienische Nomen haben ein grammatisches Geschlecht. Die Endung ist oft ein guter Hinweis – aber keine absolute Regel.',rule:'Viele Wörter auf <b>-o</b> sind männlich: <b>un pomodoro</b>. Viele Wörter auf <b>-a</b> sind weiblich: <b>una casa</b>. Bestimmte Artikel: <b>il</b> (männlich), <b>la</b> (weiblich). Vor Vokal oft <b>l’</b>. Es gibt Ausnahmen wie <b>la mano</b>.',english:'Anders als Englisch „the“ unterscheidet Italienisch <b>il</b> und <b>la</b>. Deutsch kennt das Prinzip von „der/die/das“, aber das Geschlecht stimmt nicht immer überein.',mnemonic:'🍅 Stell dir eine Tomate mit einem großen O vor: pomodor<b>o</b> → oft männlich. Eine cas<b>a</b> mit A-förmigem Dach → oft weiblich.',examples:[['il pomodoro','die Tomate'],['la casa','das Haus'],['un gatto','eine Katze (männlich)'],['una pizza','eine Pizza']],choice:{q:'Welcher Artikel passt zu „casa“?',options:['il','la','lo'],correct:1,why:'„Casa“ ist feminin: „la casa“.'},build:{q:'Bilde „eine Pizza“',words:['una','pizza'],answer:'una pizza'},write:{q:'Ergänze den bestimmten Artikel: „___ pomodoro“',answers:['il'],hint:'Pomodoro ist männlich.'},speak:'Vorrei una pizza, per favore.',dialogue:[['A','Buongiorno!'],['B','Vorrei una pizza e un pomodoro.'],['A','Certo!']]},
{id:'present',icon:'🌿',title:'Ich spreche Italienisch',subtitle:'Regelmäßige Verben auf -are',scene:'Du übst mit einem Nachbarn Italienisch.',intro:'Viele italienische Verben enden auf -are. Entferne -are und füge je nach Person eine neue Endung hinzu.',rule:'<b>Parl-are</b>: io parl<b>o</b>, tu parl<b>i</b>, lui/lei parl<b>a</b>, noi parl<b>iamo</b>, voi parl<b>ate</b>, loro parl<b>ano</b>. Dasselbe Muster hilft bei <b>abitare</b> (wohnen) und <b>comprare</b> (kaufen).',english:'Im Englischen ändert sich im Präsens oft nur die dritte Person („I speak / she speaks“). Im Italienischen zeigt fast jede Verbendung die Person.',mnemonic:'🗣️ Stell dir sechs Personen vor, die nacheinander sprechen: <b>-o, -i, -a, -iamo, -ate, -ano</b>. Sprich die Endungen wie einen Rhythmus.',examples:[['Parlo italiano.','Ich spreche Italienisch.'],['Abiti a Chia?','Wohnst du in Chia?'],['Compriamo il pane.','Wir kaufen Brot.'],['Parlano inglese.','Sie sprechen Englisch.']],choice:{q:'Welche Form passt zu „noi“?',options:['parliamo','parlate','parlo'],correct:0,why:'Bei regelmäßigen -are-Verben endet die Wir-Form auf „-iamo“.'},build:{q:'Bilde „Ich spreche Italienisch.“',words:['Parlo','italiano.'],answer:'Parlo italiano.'},write:{q:'Ergänze: „Tu ___ italiano.“ (parlare)',answers:['parli'],hint:'Bei tu endet das -are-Verb auf -i.'},speak:'Parlo un po’ italiano.',dialogue:[['A','Parli italiano?'],['B','Parlo un po’ italiano.'],['A','Benissimo!']]},
{id:'cafe',icon:'☕',title:'Un caffè, per favore',subtitle:'Höflich bestellen',scene:'Du bestellst im Café in Pula.',intro:'Mit „vorrei“ kannst du höflich einen Wunsch ausdrücken. Diese Form ist besonders praktisch, auch wenn du noch wenig Grammatik kennst.',rule:'<b>Vorrei</b> = ich hätte gern. <b>Vorrei un caffè, per favore.</b> = Ich hätte gern einen Kaffee, bitte. <b>Quanto costa?</b> = Wie viel kostet das? <b>Il conto, per favore.</b> = Die Rechnung, bitte.',english:'„Vorrei“ ist ähnlich höflich wie englisch „I would like“. Du musst die gesamte Konditional-Grammatik noch nicht beherrschen, um es sinnvoll zu benutzen.',mnemonic:'☕ Denk an englisch „would like“: <b>vorrei</b> ist dein Zauberwort für freundliche Wünsche.',examples:[['Vorrei un cappuccino.','Ich hätte gern einen Cappuccino.'],['Un’acqua, per favore.','Ein Wasser, bitte.'],['Quanto costa?','Wie viel kostet es?'],['Il conto, per favore.','Die Rechnung, bitte.']],choice:{q:'Welche Bestellung klingt besonders höflich?',options:['Caffè!','Vorrei un caffè, per favore.','Tu caffè.'],correct:1,why:'„Vorrei ... per favore“ ist eine höfliche Standardformel.'},build:{q:'Bilde „Ich hätte gern einen Kaffee, bitte.“',words:['Vorrei','un','caffè,','per','favore.'],answer:'Vorrei un caffè, per favore.'},write:{q:'Schreibe „Ich hätte gern“ auf Italienisch.',answers:['vorrei'],hint:'Ein einziges Wort, beginnt mit v.'},speak:'Vorrei un caffè, per favore.',dialogue:[['Barista','Buongiorno! Cosa desidera?'],['Du','Vorrei un caffè, per favore.'],['Barista','Certo. Altro?'],['Du','No, grazie.']]},
{id:'market',icon:'🥬',title:'Al mercato',subtitle:'Einkaufen und Mengen',scene:'Du kaufst Gemüse auf dem Markt.',intro:'Beim Einkaufen helfen wenige sehr flexible Fragen. Du kannst mit Gesten zeigen, welches Produkt du meinst, und mit Zahlen oder Mengen antworten.',rule:'<b>Quanto costa?</b> = Wie viel kostet es? <b>Quanto costano?</b> = Wie viel kosten sie? <b>Un chilo di ...</b> = ein Kilo ...; <b>mezzo chilo</b> = ein halbes Kilo; <b>questo/questa</b> = dieser/diese.',english:'„Quanto“ erinnert an englisch „quantity“ (Menge). „Questo“ ähnelt französisch „ce“ in der Funktion, ist aber ein italienisches Demonstrativwort.',mnemonic:'🥬 <b>Quanto?</b> = „Quantität oder Preis?“ – frage damit nach Mengen und Kosten.',examples:[['Un chilo di pomodori.','Ein Kilo Tomaten.'],['Quanto costano?','Wie viel kosten sie?'],['Vorrei questa melanzana.','Ich hätte gern diese Aubergine.'],['Basta così, grazie.','Das ist alles, danke.']],choice:{q:'Du kaufst mehrere Tomaten. Wie fragst du nach ihrem Preis?',options:['Quanto costano?','Come ti chiami?','Dove abiti?'],correct:0,why:'Bei mehreren Dingen nutzt du „costano“ (sie kosten).'},build:{q:'Bilde „Ein Kilo Tomaten.“',words:['Un','chilo','di','pomodori.'],answer:'Un chilo di pomodori.'},write:{q:'Was heißt „ein halbes Kilo“?',answers:['mezzo chilo','un mezzo chilo'],hint:'„Mezzo“ bedeutet halb.'},speak:'Vorrei un chilo di pomodori.',dialogue:[['Verkäuferin','Buongiorno!'],['Du','Vorrei un chilo di pomodori.'],['Verkäuferin','Certo. Altro?'],['Du','Basta così, grazie.']]},
{id:'directions',icon:'🧭',title:'Dov’è il negozio?',subtitle:'Nach dem Weg fragen',scene:'Du suchst einen Baumarkt in der Nähe von Pula.',intro:'„Dove“ bedeutet „wo“. Zusammen mit „è“ (ist) erhältst du eine der wichtigsten Fragen für deinen Alltag.',rule:'<b>Dov’è ...?</b> = Wo ist ...? <b>a destra</b> = rechts, <b>a sinistra</b> = links, <b>dritto</b> = geradeaus, <b>vicino</b> = nah, <b>lontano</b> = weit.',english:'„Dov’è“ entspricht „Where is“. Das Apostroph entsteht aus „dove + è“. Ähnlich werden im Englischen Wörter zu „where’s“ zusammengezogen.',mnemonic:'🧭 <b>Destra</b> hat ein D wie „die rechte Seite“ (D für destra). <b>Sinistra</b> klingt ein bisschen wie „sinister“ – links.',examples:[['Dov’è il negozio?','Wo ist das Geschäft?'],['Sempre dritto.','Immer geradeaus.'],['A destra.','Nach rechts.'],['È vicino?','Ist es in der Nähe?']],choice:{q:'Was bedeutet „a sinistra“?',options:['nach rechts','nach links','geradeaus'],correct:1,why:'„Sinistra“ heißt links.'},build:{q:'Bilde „Wo ist das Geschäft?“',words:["Dov’è",'il','negozio?'],answer:'Dov’è il negozio?'},write:{q:'Was heißt „geradeaus“?',answers:['dritto','sempre dritto'],hint:'Es beginnt mit dr-.'},speak:'Scusi, dov’è il negozio?',dialogue:[['Du','Scusi, dov’è il negozio?'],['Passantin','Sempre dritto, poi a destra.'],['Du','Grazie mille!']]},
{id:'tattoo',icon:'🎨',title:'Nel mio studio',subtitle:'Erste Tattoo-Kundengespräche',scene:'Du begrüßt eine Kundin im Tattoostudio.',intro:'Mit wenigen höflichen Wendungen kannst du Kunden begrüßen, nach Wünschen fragen und einfache Antworten verstehen. Komplexe Beratungen folgen später.',rule:'<b>Benvenuta!</b> = Willkommen! (zu einer Frau). <b>Come posso aiutarti?</b> = Wie kann ich dir helfen? <b>Dove lo vuoi?</b> = Wo möchtest du es? <b>Ti piace?</b> = Gefällt es dir?',english:'„Come posso aiutarti?“ entspricht „How can I help you?“; „posso“ ist „I can“, „aiutare“ ist „to help“.',mnemonic:'🎨 <b>Ti piace?</b> klingt ein wenig wie „pleasure“: Gefällt es dir?',examples:[['Benvenuta!','Willkommen!'],['Come posso aiutarti?','Wie kann ich dir helfen?'],['Ti piace questo disegno?','Gefällt dir diese Zeichnung?'],['Un momento, per favore.','Einen Moment, bitte.']],choice:{q:'Wie fragst du „Gefällt es dir?“',options:['Ti piace?','Hai fame?','Quanto costa?'],correct:0,why:'„Ti piace?“ ist die passende Frage nach Gefallen.'},build:{q:'Bilde „Wie kann ich dir helfen?“',words:['Come','posso','aiutarti?'],answer:'Come posso aiutarti?'},write:{q:'Was heißt „einen Moment“?',answers:['un momento'],hint:'Das italienische Wort ist fast identisch mit „Moment“.'},speak:'Come posso aiutarti?',dialogue:[['Du','Benvenuta! Come posso aiutarti?'],['Kundin','Vorrei un piccolo tatuaggio.'],['Du','Certo. Un momento, per favore.']]}
];
const reviewItems=lessons.flatMap(l=>l.examples.map((e,i)=>({id:l.id+'-'+i,lesson:l.id,it:e[0],de:e[1]})));function dueItems(){return reviewItems.filter(x=>db.done[x.lesson]&&(!db.reviews[x.id]||db.reviews[x.id].due<=now())).sort((a,b)=>(db.reviews[a.id]?.due||0)-(db.reviews[b.id]?.due||0))}function completed(){return Object.keys(db.done).filter(k=>db.done[k]).length}function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2800)}function say(s,slow=false){if(!('speechSynthesis'in window)){toast('Sprachausgabe wird hier nicht unterstützt');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='it-IT';u.rate=slow?.72:.9;speechSynthesis.speak(u)}function btn(text,fn,cl='primary'){return `<button class="${cl}" onclick="${fn}">${text}</button>`}function nav(){let tabs=[['home','⌂','Start'],['learn','▦','Lernen'],['review','◷','Wiederholen'],['speak','♫','Sprechen'],['profile','◉','Profil']];document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="go('${t[0]}')"><span class="ico">${t[1]}</span>${t[2]}</button>`).join('')}function go(p){page=p;selection='';checked=false;render();scrollTo(0,0)}function openLesson(i){lessonIndex=i;step=0;checked=false;selection='';typed='';bank=[];page='lesson';render();scrollTo(0,0)}function next(){let l=lessons[lessonIndex];if(step===8){db.done[l.id]=true;db.xp+=60;db.days[today()]=(db.days[today()]||0)+1;for(let x of reviewItems.filter(x=>x.lesson===l.id))if(!db.reviews[x.id])db.reviews[x.id]={due:now(),interval:0,ease:2.5,count:0};persist();page='finish';render();return}step++;selection='';typed='';bank=[];checked=false;feedback='';render();scrollTo(0,0)}function checkChoice(i){selection=String(i);checked=true;let l=lessons[lessonIndex];let ok=i===l.choice.correct;feedback=(ok?'✓ Richtig! ':'Noch nicht. ')+l.choice.why;if(!ok)db.mistakes.push({lesson:l.id,type:'Auswahl',date:today()});persist();render()}function checkBuild(){let l=lessons[lessonIndex],val=bank.map(i=>l.build.words[i]).join(' ');checked=true;let ok=norm(val)===norm(l.build.answer);feedback=(ok?'✓ Genau!':'Fast!')+' Musterlösung: '+l.build.answer;if(!ok)db.mistakes.push({lesson:l.id,type:'Satzbau',date:today()});persist();render()}function checkWrite(){let l=lessons[lessonIndex];typed=document.getElementById('writeAnswer').value;checked=true;let ok=l.write.answers.some(x=>norm(x)===norm(typed));feedback=(ok?'✓ Sehr gut!':'Noch nicht ganz. ')+'Mögliche Antwort: '+l.write.answers[0];if(!ok)db.mistakes.push({lesson:l.id,type:'Freie Antwort',date:today()});persist();render()}function bankAdd(i){if(checked)return;bank.push(i);render()}function bankRemove(j){if(checked)return;bank.splice(j,1);render()}function reviewRate(q){let items=dueItems(),x=items[0];if(!x)return;let r=db.reviews[x.id]||{interval:0,ease:2.5,count:0};r.count++;if(q===0){r.interval=0;r.due=now()+10*60*1000;r.ease=Math.max(1.3,r.ease-.2)}else{r.interval=q===1?Math.max(1,r.interval*1.2):q===2?Math.max(2,Math.round((r.interval||1)*r.ease)):Math.max(4,Math.round((r.interval||1)*r.ease*1.4));r.due=now()+r.interval*86400000;r.ease=Math.max(1.3,r.ease+(q===3?.1:q===1?-.1:0))}db.reviews[x.id]=r;db.xp+=q?5:1;persist();reviewFlip=false;render()}function record(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Spracherkennung hier nicht verfügbar. Nutze die Hör- und Nachsprechfunktion.');return}let r=new SR();r.lang='it-IT';r.interimResults=false;r.onresult=e=>{let heard=e.results[0][0].transcript,target=lessons[lessonIndex].speak;let a=new Set(norm(target).split(' ')),b=new Set(norm(heard).split(' '));let hits=[...a].filter(w=>b.has(w)).length;let score=Math.round(hits/a.size*100);document.getElementById('speechResult').innerHTML=`<div class="feedback">Erkannt: <b>${esc(heard)}</b><p>Wortübereinstimmung: ${score}%</p><small>Dies bewertet die Erkennung von Wörtern, nicht die phonetische Qualität deiner Aussprache.</small></div>`};r.onerror=e=>toast('Mikrofon/Spracherkennung: '+e.error);try{r.start();toast('Sprich jetzt den Satz')}catch(e){toast('Mikrofon konnte nicht gestartet werden')}}function render(){nav();let root=document.getElementById('app');if(page==='home'){let n=completed(),nextL=lessons.findIndex(l=>!db.done[l.id]);root.innerHTML=`<div class="hero"><div class="eyebrow">DEIN ITALIENISCH · A0 → A1</div><h1>Un passo alla volta.</h1><p>Jeden Tag ein kleiner Schritt zu echten Gesprächen auf Sardinien.</p>${btn(n===lessons.length?'Alle Lektionen ansehen':'Weiterlernen →',`openLesson(${nextL<0?0:nextL})`)}</div><div class="stats"><div class="stat"><b>${n}/${lessons.length}</b><small>Missionen</small></div><div class="stat"><b>${dueItems().length}</b><small>Fällige Karten</small></div><div class="stat"><b>${db.xp}</b><small>Lernpunkte</small></div></div><div class="sectionhead"><h2>Dein Lernweg</h2><span class="pill">A0 · Grundlagen</span></div>${lessons.slice(0,4).map((l,i)=>lessonCard(l,i)).join('')}<div class="card"><b>🧠 So lernst du nachhaltig</b><p class="learntext">Erst verstehen, dann selbst abrufen, dann in neuen Situationen anwenden. Wiederhole fällige Wörter regelmäßig – auch wenn du sie schon kennst.</p></div>`}else if(page==='learn'){root.innerHTML=`<div class="sectionhead"><h2>Deine Missionen</h2><span class="pill">${completed()} geschafft</span></div><p class="learntext">Die zehn ausführlichen A0-Missionen bauen aufeinander auf. Du kannst sie jederzeit erneut öffnen.</p>${lessons.map((l,i)=>lessonCard(l,i)).join('')}`}else if(page==='lesson'){root.innerHTML=renderLesson()}else if(page==='finish'){let l=lessons[lessonIndex];root.innerHTML=`<div class="scene"><span class="sceneicon">🏆</span><h2>Bravissima!</h2><p>Du hast eine ganze Mission abgeschlossen.</p></div><div class="card" style="margin-top:16px"><h2>${esc(l.title)}</h2><p class="learntext">+60 Lernpunkte. Die wichtigsten Ausdrücke sind jetzt für deine Wiederholungen eingeplant.</p>${btn('Wörter wiederholen',"go('review')")} ${btn('Zur Übersicht',"go('learn')",'secondary')}</div>`}else if(page==='review'){let d=dueItems();root.innerHTML=`<div class="sectionhead"><h2>Wiederholen</h2><span class="pill">${d.length} fällig</span></div><p class="learntext">Versuche, die italienische Übersetzung <b>vor dem Umdrehen</b> laut aus dem Gedächtnis abzurufen.</p>${d.length?`<div class="flash" onclick="reviewFlip=true;render()"><div><span class="tiny">${reviewFlip?'ITALIENISCH':'DEUTSCH · tippen zum Umdrehen'}</span><br><strong>${esc(reviewFlip?d[0].it:d[0].de)}</strong></div></div>${reviewFlip?`<div class="btnrow">${btn('Noch mal','reviewRate(0)','secondary')}${btn('Schwer','reviewRate(1)','secondary')}</div><div class="btnrow">${btn('Gut','reviewRate(2)')}${btn('Leicht','reviewRate(3)')}</div>`:`<div class="footeraction">${btn('Antwort zeigen','reviewFlip=true;render()')}</div>`}`:`<div class="card"><h3>🎉 Alles wiederholt!</h3><p>Keine Karten sind aktuell fällig. Nach dem Abschluss neuer Missionen erscheinen hier neue Karten.</p>${btn('Missionen ansehen',"go('learn')")}</div>`}<div class="hint">📅 Das Wiederholungssystem passt Abstände anhand deiner Selbsteinschätzung an. Es ist eine einfache leitnerähnliche Zeitplanung, keine validierte FSRS-Implementierung.</div>`}else if(page==='speak'){root.innerHTML=`<div class="sectionhead"><h2>Sprechstudio</h2><span class="pill">🎙️ Italiano</span></div><div class="scene"><span class="sceneicon">🗣️</span><h2>Parla con coraggio.</h2><p>Mutig sprechen ist wichtiger als perfekt sprechen.</p></div><div class="card" style="margin-top:14px"><h3>Deine Sprechmission</h3><p class="learntext">Öffne eine Lektion und gehe zu Schritt 7: Dort kannst du den Satz anhören, langsamer abspielen und mit dem Mikrofon nachsprechen.</p>${lessons.map((l,i)=>`<button class="answer" onclick="openLesson(${i});step=6;render()">🔊 ${esc(l.speak)} <span class="tiny">↗</span></button>`).join('')}</div><div class="hint">Auf iPhones ist automatische Spracherkennung je nach Browser eingeschränkt. Audioausgabe und Nachsprechen funktionieren auch ohne Mikrofonbewertung.</div>`}else if(page==='profile'){let h=Object.keys(db.days).length;root.innerHTML=`<div class="sectionhead"><h2>Dein Lernjournal</h2><span class="pill">🌿 Fortschritt</span></div><div class="stats"><div class="stat"><b>${completed()}</b><small>Missionen</small></div><div class="stat"><b>${db.xp}</b><small>Punkte</small></div><div class="stat"><b>${h}</b><small>Lerntage</small></div></div><div class="card" style="margin-top:14px"><b>Dein Lernverlauf</b><div class="chart">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toISOString().slice(0,10),v=db.days[k]||0;return `<div class="bar ${i===6?'current':''}" style="height:${Math.max(12,Math.min(100,v*25))}%"><label>${['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]}</label></div>`}).join('')}</div><p class="mini" style="margin-top:28px">Abgeschlossene Missionen je Tag, letzte sieben Tage</p></div><div class="card"><h3>📝 Meine Notizen</h3><p class="mini">Deine Notizen bleiben in diesem Browser gespeichert.</p><textarea class="field" id="notes" placeholder="Neue Wörter, Eselsbrücken, eigene Sätze …">${esc(db.notes)}</textarea><div class="btnrow">${btn('Notizen speichern','saveNotes()')}</div></div><div class="card"><h3>Deine Daten</h3><p class="mini">Exportiere deinen Fortschritt als JSON oder importiere ihn auf einem anderen Gerät. Ohne Konto gibt es keine automatische Synchronisierung.</p><div class="btnrow">${btn('JSON exportieren','exportData()')}${btn('JSON importieren',"document.getElementById('importFile').click()",'secondary')}</div><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><div class="card"><h3>Grammatik-Atlas</h3><p class="learntext">Die Lernreise startet mit Aussprache, essere, avere, Artikeln und Präsens. Spätere Stufen werden nach und nach ergänzt – keine leeren A2/B1-Lektionen.</p>${btn('Konjugationslabor öffnen',"page='grammar';render()",'secondary')}</div>`}else if(page==='grammar'){root.innerHTML=`<div class="lessonhead"><button class="back" onclick="go('profile')">‹</button><strong>Interaktives Konjugationslabor</strong></div><div class="card"><h3>Verb auswählen</h3><div class="tabs">${['parlare','abitare','comprare'].map(v=>`<button class="${grammarVerb===v?'active':''}" onclick="grammarVerb='${v}';render()">${v}</button>`).join('')}</div><p class="mini">Tippe auf ein Pronomen und beobachte, wie sich die Endung verändert.</p><div class="grammargrid">${['io','tu','lui/lei','noi','voi','loro'].map((p,i)=>`<button class="grammarcell" style="border-color:${grammarSubject===i?'#2b805e':'#e5e8df'}" onclick="grammarSubject=${i};render()"><small>${p}</small><strong>${grammarVerb.slice(0,-3)}${['o','i','a','iamo','ate','ano'][i]}</strong></button>`).join('')}</div><div class="hint">🌿 <b>Stamm + Endung:</b> <b>${grammarVerb.slice(0,-3)}</b> + <b>${['o','i','a','iamo','ate','ano'][grammarSubject]}</b> = <b>${grammarVerb.slice(0,-3)+['o','i','a','iamo','ate','ano'][grammarSubject]}</b>. Die Endung verrät, wer etwas tut.</div>${btn('🔊 Anhören',`say('${['io','tu','lui','noi','voi','loro'][grammarSubject]} ${grammarVerb.slice(0,-3)+['o','i','a','iamo','ate','ano'][grammarSubject]}')`,'secondary')}</div>`}root.querySelectorAll('button').forEach(b=>b.setAttribute('type','button'))}
function lessonCard(l,i){return `<div class="card lessoncard" onclick="openLesson(${i})"><div class="bubble">${l.icon}</div><div style="flex:1"><h3>${i+1}. ${esc(l.title)} ${db.done[l.id]?'✓':''}</h3><p>${esc(l.subtitle)}</p></div><span style="color:var(--green)">›</span></div>`}
function renderLesson(){let l=lessons[lessonIndex],names=['Situation','Verstehen','Beispiele','Grammatik','Wissenstest','Satzbau','Selbst schreiben','Sprechen','Dialog'];let header=`<div class="lessonhead"><button class="back" onclick="go('learn')">‹</button><div style="flex:1"><strong>${esc(l.title)}</strong><div class="stage">Schritt ${step+1} von 9 · ${names[step]}</div></div></div><div class="progress" style="margin-bottom:19px"><div style="width:${(step+1)/9*100}%"></div></div>`;let c='';if(step===0)c=`<div class="scene"><span class="sceneicon">${l.icon}</span><h2>${esc(l.title)}</h2><p>${esc(l.scene)}</p></div><div class="card" style="margin-top:14px"><div class="eyebrow" style="color:#568370">DEIN LERNZIEL</div><p class="learntext">${l.intro}</p><div class="hint">💡 <b>Eselsbrücke:</b> ${l.mnemonic}</div></div>`;if(step===1)c=`<div class="card"><span class="pill">Warum funktioniert das?</span><h2>Die Regel verstehen</h2><p class="learntext">${l.rule}</p><div class="divider"></div><b>🇬🇧 Brücke zum Englischen</b><p class="learntext">${l.english}</p></div><div class="hint">Merke: Du musst nicht alle Regeln sofort auswendig können. Versuche zuerst, sie in Beispielen wiederzuerkennen.</div>`;if(step===2)c=`<h2 style="font-family:Fraunces,serif">Hören, sehen, verstehen</h2><p class="mini">Tippe auf 🔊 und sprich jeden Satz einmal laut nach.</p>${l.examples.map(e=>`<div class="card"><div class="italian" style="font-size:23px">${esc(e[0])}</div><div class="translation">${esc(e[1])}</div><div class="btnrow">${btn('🔊 Hören',`say(${JSON.stringify(e[0])})`,'secondary')}${btn('🐢 Langsam',`say(${JSON.stringify(e[0])},true)`,'secondary')}</div></div>`).join('')}`;if(step===3)c=`<div class="card"><h2 style="font-family:Fraunces,serif">So setzt du es zusammen</h2><p class="learntext">${l.rule}</p>${l.id==='present'?`<div class="grammargrid">${['io','tu','lui/lei','noi','voi','loro'].map((p,i)=>`<div class="grammarcell"><small>${p}</small><strong>parl${['o','i','a','iamo','ate','ano'][i]}</strong></div>`).join('')}</div>${btn('Konjugationen ausprobieren',"page='grammar';render()",'secondary')}`:l.id==='essere'||l.id==='avere'?`<div class="grammargrid">${['io','tu','lui/lei','noi','voi','loro'].map((p,i)=>`<div class="grammarcell"><small>${p}</small><strong>${(l.id==='essere'?['sono','sei','è','siamo','siete','sono']:['ho','hai','ha','abbiamo','avete','hanno'])[i]}</strong></div>`).join('')}</div>`:`<div class="hint">${l.mnemonic}</div>`}</div>`;if(step===4)c=`<div class="card"><span class="pill">Wissenstest</span><h2>${esc(l.choice.q)}</h2>${l.choice.options.map((x,i)=>`<button class="answer ${selection===String(i)?'selected':''} ${checked&&selection===String(i)&&i!==l.choice.correct?'wrong':''}" onclick="checkChoice(${i})">${String.fromCharCode(65+i)} · ${esc(x)}</button>`).join('')}${checked?`<div class="feedback ${Number(selection)!==l.choice.correct?'bad':''}">${feedback}</div>`:''}</div>`;if(step===5)c=`<div class="card"><span class="pill">Aktives Erinnern</span><h2>${esc(l.build.q)}</h2><p class="mini">Tippe die Wortbausteine in der richtigen Reihenfolge an. Tippe oben auf ein Wort, um es zu entfernen.</p><div class="wordline">${bank.map((i,j)=>`<button onclick="bankRemove(${j})">${esc(l.build.words[i])} ×</button>`).join('')}</div><div class="wordbank">${l.build.words.map((w,i)=>`<button class="word ${bank.includes(i)?'used':''}" ${bank.includes(i)?'disabled':''} onclick="bankAdd(${i})">${esc(w)}</button>`).join('')}</div>${btn('Antwort prüfen','checkBuild()','secondary')}${checked?`<div class="feedback">${esc(feedback)}</div>`:''}</div>`;if(step===6)c=`<div class="card"><span class="pill">Ohne Auswahlmöglichkeiten</span><h2>${esc(l.write.q)}</h2><p class="mini">Schreibe deine Antwort aus dem Gedächtnis. Kleine Akzent- und Satzzeichenunterschiede werden toleriert.</p><input class="field" id="writeAnswer" autocomplete="off" autocapitalize="none" value="${esc(typed)}" placeholder="Deine Antwort auf Italienisch"> <div class="btnrow">${btn('Antwort prüfen','checkWrite()')}${btn('Hinweis',`toast(${JSON.stringify(l.write.hint)})`,'secondary')}</div>${checked?`<div class="feedback">${esc(feedback)}</div>`:''}</div>`;if(step===7)c=`<div class="speak"><div style="font-size:42px">🎙️</div><h2 style="font-family:Fraunces,serif">Sprich laut!</h2><div class="italian">${esc(l.speak)}</div><p class="mini">Erst hören, dann ohne Hilfe nachsprechen.</p><div class="btnrow">${btn('🔊 Anhören',`say(${JSON.stringify(l.speak)})`,'secondary')}${btn('🐢 Langsam',`say(${JSON.stringify(l.speak)},true)`,'secondary')}</div><button class="mic" onclick="record()" aria-label="Mikrofon starten">🎤</button><p class="mini">Mikrofon antippen und sprechen</p><div id="speechResult"></div></div><div class="hint">Eine Spracherkennung erkennt Wörter, misst aber keine einzelnen Laute. Auf manchen iPhones ist diese Funktion nicht verfügbar.</div>`;if(step===8)c=`<div class="card"><span class="pill">Echte Alltagssituation</span><h2>Ein Mini-Dialog</h2><p class="mini">Lies beide Rollen. Sprich deine Rolle laut und versuche danach, ohne Text zu antworten.</p>${l.dialogue.map((d,i)=>`<div style="margin:12px 0;display:flex;justify-content:${i%2?'flex-end':'flex-start'}"><div style="max-width:85%;padding:12px 15px;border-radius:16px;background:${i%2?'#e0eddf':'#f6eee0'}"><small>${esc(d[0])}</small><div style="font-weight:700;margin:5px 0">${esc(d[1])}</div><button class="secondary" style="padding:6px 10px;font-size:12px" onclick="say(${JSON.stringify(d[1])})">🔊</button></div></div>`).join('')}</div><div class="hint">🎯 Transfer-Aufgabe: Stell dir vor, du stehst wirklich in dieser Situation. Formuliere mindestens einen Satz ohne abzulesen.</div>`;return header+c+`<div class="footeraction">${btn(step===8?'Mission abschließen ✓':'Weiter →','next()')}</div>`}
function saveNotes(){db.notes=document.getElementById('notes').value;persist();toast('Notizen gespeichert')}function exportData(){let blob=new Blob([JSON.stringify({app:'parla',version:3,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='parla-fortschritt.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.app!=='parla'||!x.data||typeof x.data.done!=='object')throw Error('Ungültiges Format');if(!confirm('Aktuellen Fortschritt mit dem importierten Stand ersetzen?'))return;db=x.data;persist();render();toast('Fortschritt importiert')}catch(e){toast('Import fehlgeschlagen: ungültige Datei')}};r.readAsText(f)}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
