const mnemonics=[['GN = nj','Gnocchi klingt ungefähr „Njokki“. Das G hörst du nicht einzeln.','gnocchi'],['GLI = weiches lj','Famiglia: Die Zunge liegt am Gaumen; nicht einfach „g-li“ sprechen.','famiglia'],['SC + E/I = sch','Pesce klingt wie „Pesche“.','pesce'],['SC + A/O/U = sk','Scusa beginnt mit einem klaren „sk“.','scusa'],['C + E/I = tsch','Cena klingt wie „Tschen-a“.','cena'],['CH + E/I = k','Che wird „ke“ ausgesprochen. Das H macht das C hart.','che'],['Doppelkonsonanten zählen','Pala (Schaufel) und palla (Ball): Das zweite L wird länger gesprochen.','palla'],['Essere = sein','„Sono“ ist „ich bin“. Merke: Sono in Sardegna.','sono'],['Avere = haben','„Ho“ = ich habe; das H bleibt stumm.','ho'],['Boh = Schulterzucken','Stell dir vor, du zuckst mit den Schultern: „Boh!“','boh'],['Magari = Wunsch oder Möglichkeit','„Magari!“ kann „Das wäre schön!“ bedeuten, aber auch „vielleicht“.','magari'],['Camera ist ein Zimmer','Deine Kamera liegt in deiner camera – dem Zimmer.','camera'],['Libreria = Bücher kaufen','In der libreria kaufst du Bücher; in der biblioteca leihst du sie.','libreria'],['Quanto = wie viel','„Quanto costa?“ ist dein Satz für den Markt in Pula.','quanto'],['Mi piace = gefällt mir','Nicht „ich mag“ wörtlich: „Das gefällt mir“.','piace']];
const stories=[{title:'Auf dem Markt in Pula',level:'A1',text:'Lu va al mercato di Pula. Vuole comprare dei pomodori. Chiede: «Quanto costa un chilo?» Il venditore risponde: «Tre euro». Lu dice: «Mezzo chilo, per favore». Alla fine dice: «Basta così, grazie!»',q:'Wie viel kostet ein ganzes Kilo Tomaten?',opts:['Zwei Euro','Drei Euro','Fünf Euro'],correct:1,why:'Der Verkäufer sagt: «Tre euro».'},{title:'Ein Kaffee in Chia',level:'A1',text:'Mirco e Lu entrano in un bar. Lu dice: «Un caffè, per favore». Il barista chiede: «Al banco o al tavolo?» Lu risponde: «Al banco». Mirco paga e dice: «Grazie, ci vediamo domani!»',q:'Wo trinken sie den Kaffee?',opts:['Am Tisch','An der Theke','Am Strand'],correct:1,why:'«Al banco» bedeutet an der Theke.'},{title:'Ein Gespräch mit der Nachbarin',level:'A1',text:'La vicina parla molto velocemente. Lu non capisce tutto. Dice: «Scusa, puoi ripetere? Parla più lentamente, per favore». La vicina sorride e ripete la frase.',q:'Was bittet Lu die Nachbarin?',opts:['Sie soll langsamer sprechen','Sie soll morgen kommen','Sie soll einkaufen gehen'],correct:0,why:'«Parla più lentamente» heißt „Sprich langsamer“.'}];
const quiz=[{type:'pairs',title:'Verbinde die richtigen Paare',pairs:[['Boh','Keine Ahnung'],['Che bello!','Wie schön!'],['A presto','Bis bald'],['Quanto costa?','Wie viel kostet das?']]},{type:'gap',title:'Ergänze den Satz',sentence:'___ costa un chilo di pomodori?',opts:['Quando','Quanto','Dove'],correct:1,explain:'Quanto costa? bedeutet „Wie viel kostet es?“'},{type:'write',title:'Schreibe auf Italienisch',prompt:'Wie sagst du „Kannst du das wiederholen?“',correct:'Puoi ripetere?',explain:'Puoi = du kannst, ripetere = wiederholen.'},{type:'read',title:'Leseverständnis',story:0},{type:'gap',title:'Ergänze den Satz',sentence:'Un caffè, ___ favore.',opts:['con','per','di'],correct:1,explain:'Per favore heißt „bitte“.'},{type:'write',title:'Schreibe auf Italienisch',prompt:'Wie sagst du „Bis bald“?',correct:'A presto',explain:'A presto ist eine freundliche Verabschiedung.'},{type:'pairs',title:'Verbinde die richtigen Paare',pairs:[['Essere','Sein'],['Avere','Haben'],['Andare','Gehen / fahren'],['Fare','Machen / tun']]},{type:'read',title:'Leseverständnis',story:1},{type:'gap',title:'Ergänze den Satz',sentence:'Non ___ ho idea.',opts:['ne','mi','ti'],correct:0,explain:'Non ne ho idea = Ich habe keine Ahnung.'},{type:'write',title:'Schreibe auf Italienisch',prompt:'Wie sagst du „Ich kümmere mich darum“?',correct:'Ci penso io',explain:'Ci penso io ist ein sehr nützlicher Alltagssatz.'},{type:'read',title:'Leseverständnis',story:2},{type:'gap',title:'Ergänze den Satz',sentence:'___ un attimo, per favore.',opts:['Aspetta','Quanto','Magari'],correct:0,explain:'Aspetta un attimo = Warte einen Moment.'}];
let state={page:'home',filter:'Alle',search:'',qi:0,chosen:-1,locked:false,pairLeft:-1,pairRight:-1,matched:[],wrong:false,points:0};let saved;try{saved=JSON.parse(localStorage.getItem('parla-v5'))||{xp:0,completed:0,known:[],favorites:[],mnemo:[]}}catch(e){saved={xp:0,completed:0,known:[],favorites:[],mnemo:[]}}function persist(){localStorage.setItem('parla-v5',JSON.stringify(saved))}function nav(page){state.page=page;state.search='';render();scrollTo(0,0)}function say(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.78;speechSynthesis.speak(u)}function footer(){return `<nav class="bottom">${[['home','home','Start'],['book','words','Wörter'],['brain','mnemo','Eselsbrücken'],['spark','practice','Üben']].map(([ic,p,t])=>`<button class="nav ${state.page===p?'active':''}" onclick="nav('${p}')">${ico(ic)}${t}</button>`).join('')}</nav>`}function header(){return `<div class="top"><div class="logo">parla<i>!</i></div><span class="pill">${ico('star')} ${saved.xp} XP</span></div>`}function home(){return `<div class="eyebrow">Dein Italienisch. Dein Alltag.</div><div class="hero"><span class="pill">Kleine Schritte, große Wirkung</span><h1 style="margin-top:18px">Ciao, schön, dass du da bist.</h1><p class="muted" style="max-width:255px">Lerne so, wie Italienisch in Chia und Pula wirklich klingt.</p><div class="art">◡</div><button class="btn" style="max-width:220px" onclick="startQuiz()">Jetzt üben ${ico('arrow')}</button></div><div class="grid2"><div class="stat" style="background:var(--mint)"><span class="small muted">Lernrunden</span><strong>${saved.completed}</strong></div><div class="stat" style="background:var(--yellow)"><span class="small muted">Wörter im Katalog</span><strong>${words.length}</strong></div></div><div class="sectionhead"><h2>Entdecke parla!</h2></div>${[['book','Wortschatz aus dem echten Leben','Alltag, Markt, Café, Slang und mehr','words','var(--peach)'],['brain','Alle Eselsbrücken','Aussprache, Grammatik und Worttricks','mnemo','var(--lav)'],['spark','Interaktiv üben','Verbinden, schreiben, Lücken füllen, lesen','practice','var(--blue)']].map(([ic,t,d,p,b])=>`<button class="card course" onclick="nav('${p}')"><span class="tile" style="background:${b}">${ico(ic)}</span><span><b>${t}</b><div class="small muted" style="margin-top:5px">${d}</div></span><span class="arrow">${ico('arrow')}</span></button>`).join('')}<div class="note"><b>Dein Lernprinzip</b><div class="small">Erst verstehen, dann aktiv abrufen, Fehler korrigieren und später wiederholen. Die Beispiele stammen aus deinen Screenshots und sind sprachlich eingeordnet.</div></div>`}
function wordsPage(){let cats=['Alle',...new Set(words.map(x=>x.cat))];let list=words.filter(w=>(state.filter==='Alle'||w.cat===state.filter)&&norm(w.it+' '+w.de+' '+w.note).includes(norm(state.search)));return `<h1>Wörter, die du wirklich brauchst.</h1><p class="muted">${words.length} Ausdrücke mit deutscher Bedeutung, Kontext und Register.</p><input class="search" placeholder="Italienisch oder Deutsch suchen" value="${esc(state.search)}" oninput="state.search=this.value;updateWordList()"><div class="chips" id="filters">${cats.map(c=>`<button class="chip ${state.filter===c?'active':''}" onclick="state.filter=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${esc(c)}</button>`).join('')}</div><div id="wordlist">${wordCards(list)}</div>`}function wordCards(list){return list.length?list.map(w=>`<article class="word"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><strong>${esc(w.it)}</strong><button class="round" style="background:var(--blue);width:37px;height:37px" onclick="say(${JSON.stringify(w.it).replace(/"/g,'&quot;')})" aria-label="Vorlesen">${ico('volume')}</button></div><div class="meaning">${esc(w.de)}</div><div class="small muted" style="margin-bottom:9px">${esc(w.note)}</div><span class="tag">${esc(w.register)}</span><span class="small muted" style="float:right">${esc(w.cat)}</span></article>`).join(''):'<div class="empty">Keine passenden Wörter gefunden.</div>'}function updateWordList(){document.getElementById('wordlist').innerHTML=wordCards(words.filter(w=>(state.filter==='Alle'||w.cat===state.filter)&&norm(w.it+' '+w.de+' '+w.note).includes(norm(state.search))))}
function mnemoPage(){return `<h1>Deine Eselsbrücken.</h1><p class="muted">Alles, was dir beim Erinnern hilft, an einem Ort. Tippe auf den Lautsprecher, um das Beispiel zu hören.</p><div class="grid2"><div class="stat" style="background:var(--lav)"><strong>${mnemonics.length}</strong><span class="small muted">Merkhilfen</span></div><div class="stat" style="background:var(--mint)"><strong>${saved.mnemo.length}</strong><span class="small muted">Schon gemerkt</span></div></div>${mnemonics.map((m,i)=>`<div class="card" style="border-left:5px solid ${i%3===0?'#d8b1a1':i%3===1?'#aa9bdb':'#a2cfba'}"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(m[0])}</h3><button class="round" onclick="say(${JSON.stringify(m[2]).replace(/"/g,'&quot;')})">${ico('volume')}</button></div><p class="muted" style="margin:0 0 12px">${esc(m[1])}</p><button class="chip ${saved.mnemo.includes(i)?'active':''}" onclick="toggleMemo(${i})">${saved.mnemo.includes(i)?'Gemerkt':'Als gemerkt markieren'} ${ico('check')}</button></div>`).join('')}`}function toggleMemo(i){saved.mnemo=saved.mnemo.includes(i)?saved.mnemo.filter(x=>x!==i):[...saved.mnemo,i];persist();render()}
function startQuiz(){state.qi=0;state.points=0;resetQuestion();state.page='quiz';render();scrollTo(0,0)}function resetQuestion(){state.chosen=-1;state.locked=false;state.pairLeft=-1;state.pairRight=-1;state.matched=[];state.wrong=false}function nextQ(){state.qi++;resetQuestion();if(state.qi>=quiz.length){saved.xp+=state.points*10;saved.completed++;persist();state.page='result'}render();scrollTo(0,0)}function practice(){return `<h1>Üben macht mutig.</h1><p class="muted">Vier Aufgabentypen in einer abwechslungsreichen Lernrunde. Du bekommst Feedback zu jeder Antwort.</p><div class="hero" style="background:var(--blue)"><span class="pill">12 Aufgaben</span><h1 style="margin-top:15px">Zeit für eine kleine Italienisch-Pause.</h1><p class="muted">Wortpaare, Lückensätze, freies Schreiben und Leseverständnis.</p><button class="btn" onclick="startQuiz()">Lernrunde starten ${ico('arrow')}</button></div><h2>Was du trainierst</h2>${[['shuffle','Wortpaare verbinden','Finde passende italienische und deutsche Ausdrücke.'],['pencil','Wörter selbst schreiben','Tippe die Antwort ohne vorgegebene Optionen.'],['book','Texte verstehen','Lies kurze Geschichten aus deinem Alltag.'],['message','Lücken ergänzen','Wähle das Wort, das wirklich passt.']].map(([ic,t,d])=>`<div class="card course"><span class="tile" style="background:var(--mint)">${ico(ic)}</span><span><b>${t}</b><div class="small muted">${d}</div></span></div>`).join('')}`}
function quizPage(){let q=quiz[state.qi];let intro=`<button class="back" onclick="nav('practice')">${ico('left')} Übung verlassen</button><div class="small muted">Aufgabe ${state.qi+1} von ${quiz.length}</div><div class="progress"><span style="width:${state.qi/quiz.length*100}%"></span></div>`;if(q.type==='pairs'){let left=q.pairs.map((p,i)=>({txt:p[0],id:i})),right=[...q.pairs.map((p,i)=>({txt:p[1],id:i}))].sort((a,b)=>(a.id*7%5)-(b.id*7%5));return intro+`<div class="question"><div class="eyebrow">Zuordnen</div><h2>${q.title}</h2><p class="small muted">Tippe zuerst links, dann rechts.</p></div><div class="pairgrid"><div>${left.map(p=>pairButton(p,'L')).join('')}</div><div>${right.map(p=>pairButton(p,'R')).join('')}</div></div><div id="pairfeedback"></div>${state.matched.length===4?`<button class="btn" onclick="nextQ()">Weiter ${ico('arrow')}</button>`:''}`}
if(q.type==='gap'){return intro+`<div class="question"><div class="eyebrow">Lückentext</div><h2>${q.title}</h2><h2 style="margin-top:20px">${esc(q.sentence)}</h2></div><div class="answer">${q.opts.map((o,i)=>`<button class="choice ${state.chosen===i?(i===q.correct?'correct':'wrong'):''}" onclick="selectAnswer(${i})" ${state.locked?'disabled':''}>${esc(o)}</button>`).join('')}</div>${state.locked?`<div class="feedback ${state.chosen===q.correct?'':'bad'}"><b>${state.chosen===q.correct?'Richtig!':'Noch nicht ganz.'}</b><br>${esc(q.explain)}</div><button class="btn" onclick="nextQ()">Weiter ${ico('arrow')}</button>`:''}`}
if(q.type==='write'){return intro+`<div class="question"><div class="eyebrow">Selbst schreiben</div><h2>${q.title}</h2><p>${esc(q.prompt)}</p></div><input class="write" id="written" placeholder="Deine Antwort auf Italienisch" autocomplete="off" autocapitalize="sentences" ${state.locked?'disabled':''} onkeydown="if(event.key==='Enter')checkWrite()">${state.locked?`<div class="feedback ${state.wrong?'bad':''}"><b>${state.wrong?'Fast! Hier ist die Lösung:':'Richtig!'}</b><br>${esc(q.correct)}<br>${esc(q.explain)}</div><button class="btn" onclick="nextQ()">Weiter ${ico('arrow')}</button>`:`<button class="btn" onclick="checkWrite()">Antwort prüfen</button>`}`}
let s=stories[q.story];return intro+`<div class="question"><div class="eyebrow">Leseverständnis · ${s.level}</div><h2>${esc(s.title)}</h2></div><div class="read">${esc(s.text)}</div><div class="card"><h3>${esc(s.q)}</h3><div class="answer">${s.opts.map((o,i)=>`<button class="choice ${state.chosen===i?(i===s.correct?'correct':'wrong'):''}" onclick="selectAnswer(${i})" ${state.locked?'disabled':''}>${esc(o)}</button>`).join('')}</div>${state.locked?`<div class="feedback ${state.chosen===s.correct?'':'bad'}">${esc(s.why)}</div><button class="btn" onclick="nextQ()">Weiter ${ico('arrow')}</button>`:''}</div>`}
function pairButton(p,side){let done=state.matched.includes(p.id),selected=side==='L'?state.pairLeft===p.id:state.pairRight===p.id;return `<button style="width:100%;margin-bottom:9px" class="choice ${done?'correct':selected?'selected':''}" onclick="pairClick('${side}',${p.id})" ${done?'disabled':''}>${esc(p.txt)}</button>`}function pairClick(side,id){if(side==='L')state.pairLeft=id;else state.pairRight=id;if(state.pairLeft!==-1&&state.pairRight!==-1){if(state.pairLeft===state.pairRight){state.matched.push(id);if(state.matched.length===4)state.points++}else state.wrong=true;state.pairLeft=-1;state.pairRight=-1}render()}function selectAnswer(i){if(state.locked)return;state.chosen=i;state.locked=true;let q=quiz[state.qi],correct=q.type==='read'?stories[q.story].correct:q.correct;if(i===correct)state.points++;render()}function checkWrite(){let input=document.getElementById('written');if(!input||!input.value.trim())return;let q=quiz[state.qi];state.wrong=norm(input.value)!==norm(q.correct);if(!state.wrong)state.points++;state.locked=true;render()}function result(){return `<div style="padding-top:70px;text-align:center"><div class="tile" style="margin:auto;background:var(--yellow);width:95px;height:95px;border-radius:35px">${ico('star')}</div><h1 style="margin-top:25px">Bravissima!</h1><p class="muted">Du hast deine Lernrunde abgeschlossen.</p><div class="grid2"><div class="stat"><strong>${state.points}/${quiz.length}</strong><span class="small muted">Richtige Aufgaben</span></div><div class="stat"><strong>+${state.points*10}</strong><span class="small muted">XP gesammelt</span></div></div><button class="btn" onclick="startQuiz()">Noch eine Runde</button><button class="btn secondary" onclick="nav('home')">Zur Startseite</button></div>`}function render(){document.getElementById('app').innerHTML=header()+(state.page==='home'?home():state.page==='words'?wordsPage():state.page==='mnemo'?mnemoPage():state.page==='practice'?practice():state.page==='quiz'?quizPage():result())+(state.page==='quiz'||state.page==='result'?'':footer())}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
